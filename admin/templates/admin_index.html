<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lingora Admin</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; }
      header { display:flex; align-items:center; justify-content:space-between; margin-bottom: 16px; }
      h1 { font-size: 22px; margin: 0; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
      th { background: #f9fafb; }
      .muted { color:#6b7280; }
      a.btn { text-decoration:none; background:#111827; color:white; padding:8px 12px; border-radius:6px; font-weight:600; }
    </style>
  </head>
  <body>
    <header>
      <h1>Lingora Admin</h1>
      <div>
        <span class="muted">{{ user.name }} ({{ user.email }})</span>
        &nbsp; <a class="btn" href="/admin/logout">Logout</a>
      </div>
    </header>

    <h2>Create User</h2>
    <form method="post" action="/admin/users" style="margin-bottom:16px;display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end;">
      <div>
        <label>Name</label>
        <input name="name" required />
      </div>
      <div>
        <label>Email</label>
        <input type="email" name="email" required />
      </div>
      <div>
        <label>Password</label>
        <input type="password" name="password" required />
      </div>
      <div>
        <button type="submit">Create</button>
      </div>
    </form>

    <h2>Users</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Roles</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for u in users %}
          <tr>
            <td>{{ u.id }}</td>
            <td>{{ u.name }}</td>
            <td>{{ u.email }}</td>
            <td>{{ u.roles }}</td>
            <td class="muted">{{ u.created_at }}</td>
            <td>
              <form method="post" action="/admin/users/{{ u.id }}/password" style="display:inline-flex; gap:4px; align-items:center;">
                <input type="password" name="password" placeholder="New password" required />
                <button type="submit">Set</button>
              </form>
              <form method="post" action="/admin/users/{{ u.id }}/delete" style="display:inline; margin-left:8px;" onsubmit="return confirm('Delete user {{ u.email }}?');">
                <button type="submit">Delete</button>
              </form>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>

    <p style="margin-top:12px"><a class="btn" href="/admin/export/users.csv">Export CSV</a></p>
  </body>
  </html>
