<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lingora Admin – Login</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 40px; }
      .card { max-width: 420px; margin: 80px auto; padding: 24px; border: 1px solid #e5e7eb; border-radius: 8px; }
      h1 { margin: 0 0 16px; font-size: 22px; }
      label { display: block; margin: 12px 0 6px; font-weight: 600; }
      input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; }
      button { margin-top: 16px; width: 100%; padding: 10px; border: 0; border-radius: 6px; background: #111827; color: white; font-weight: 600; cursor: pointer; }
      .error { color: #b91c1c; margin-top: 8px; }
      .muted { color: #6b7280; font-size: 12px; margin-top: 12px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Admin Login</h1>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <form method="post" action="/admin/login">
        <label>Email</label>
        <input type="email" name="email" value="admin@lingora.local" required />
        <label style="margin-top:14px">Password</label>
        <input type="password" name="password" required />
        <button type="submit">Sign In</button>
      </form>
      <div class="muted">Use your admin credentials.</div>
    </div>
  </body>
  </html>
