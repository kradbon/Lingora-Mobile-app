<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lingora Admin - Login</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0b;
        --panel: rgba(18, 18, 18, 0.86);
        --border: rgba(255, 255, 255, 0.12);
        --border-strong: rgba(255, 255, 255, 0.16);
        --text: #f5f5f5;
        --muted: #a3a3a3;
        --gold: #d4af37;
        --gold-2: #b88a2a;
        --radius: 16px;
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: radial-gradient(1200px 800px at 15% 10%, #1a1a1a 0%, var(--bg) 55%, #000 100%);
        color: var(--text);
      }
      .wrap { min-height: 100%; display:flex; align-items:center; justify-content:center; padding: 28px 18px; }
      .card { width:100%; max-width: 460px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
      .brand { font-weight: 900; letter-spacing: 0.5px; color: var(--gold); }
      h1 { margin: 10px 0 6px; font-size: 22px; }
      .sub { margin:0 0 18px; color: var(--muted); font-size: 13px; line-height: 1.45; }
      .form { display:grid; gap: 12px; }
      .field { display:grid; gap: 6px; }
      label { font-weight: 700; color: #e5e5e5; font-size: 13px; }
      input {
        width:100%;
        padding: 12px 12px;
        border-radius: 12px;
        border: 1px solid var(--border-strong);
        background: rgba(0, 0, 0, 0.35);
        color: var(--text);
        outline: none;
      }
      input:focus { border-color: rgba(212, 175, 55, 0.7); box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.16); }
      button {
        width:100%;
        margin-top: 4px;
        padding: 12px 12px;
        border-radius: 12px;
        border: 1px solid rgba(212, 175, 55, 0.55);
        background: linear-gradient(180deg, #e4cc78 0%, var(--gold) 60%, var(--gold-2) 100%);
        color:#0b0b0b;
        font-weight: 900;
        letter-spacing: 0.2px;
        cursor:pointer;
      }
      button:hover { filter: brightness(1.03); }
      .alert { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(212, 175, 55, 0.10); border: 1px solid rgba(212, 175, 55, 0.25); color: var(--text); font-size: 13px; }
      .hint { margin-top: 14px; color: var(--muted); font-size: 12px; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="brand">Lingora</div>
        <h1>Admin login</h1>
        <p class="sub">This panel is for administrators only. End users should use the mobile app.</p>

        {% if error %}<div class="alert">{{ error }}</div>{% endif %}

        <form method="post" action="/admin/login" class="form">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" name="email" value="{{ email }}" required autofocus />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" name="password" required />
          </div>
          <button type="submit">Sign in</button>
        </form>

        <div class="hint">Credentials come from <code>ADMIN_EMAIL</code> / <code>ADMIN_PASSWORD</code> in <code>backend/.env</code>.</div>
      </div>
    </div>
  </body>
</html>
